name: News operations
on:
  schedule:
    # Asia/Seoul weekday 01:15..23:15 (UTC crosses the previous day).
    - cron: '15 16,18,20,22 * * 0-4'
    - cron: '15 0,2,4,6,8,10,12,14 * * 1-5'
    # Asia/Seoul weekend 00:15,06:15,12:15,18:15.
    - cron: '15 15,21 * * 5,6'
    - cron: '15 3,9 * * 0,6'
    # Briefing wakeups: weekday 09:00, every day 17:00 KST.
    - cron: '0 0 * * 1-5'
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      redeploy_run_id:
        description: '런타임 수정 검증용: 성공한 main 실행의 기존 dashboard만 Production 재배포 (수집·DB 변경 없음)'
        type: string
        default: ''
      diagnose_auth:
        description: '읽기 전용 Cloudflare API 인증 진단만 실행 (수집·배포 없음)'
        type: boolean
        default: false
      initialize:
        description: '첫 실행/보존 기한 경과 후 명시적 새 상태 시작 (기존 아티팩트가 있으면 복원 우선)'
        type: boolean
        default: false
      mode:
        description: 'scheduled=수집·브리핑, refresh=저장 데이터 분석·검색·화면 갱신'
        type: choice
        options: [scheduled, collect, am, pm, refresh]
        default: scheduled
      publish:
        description: 'main에서 기존 비공개 Cloudflare Pages로 배포 (Secrets·Access 검증 변수 설정 필요)'
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
concurrency:
  group: carmgz-production-state
  cancel-in-progress: false
jobs:
  diagnose-cloudflare-auth:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose_auth
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    environment: cloudflare-pages
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only token verification and Pages project lookup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/check_cloudflare.py
      - name: Inspect runtime binding metadata without values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/inspect_cloudflare_runtime.py
  operate:
    if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && !inputs.diagnose_auth && !inputs.redeploy_run_id
    runs-on: ubuntu-latest
    # RSS budget 8 min + CARMGZ 3 min + state/deployment overhead.
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: '1'
      STATE_BRANCH: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select isolated state namespace
        run: echo "STATE_PREFIX=$(python scripts/actions_state.py namespace)" >> "$GITHUB_ENV"
      - name: Restore persisted state (fail closed)
        id: restore
        env:
          INITIALIZE: ${{ inputs.initialize }}
        run: |
          if [ "$INITIALIZE" = "true" ]; then
            python scripts/actions_state.py restore --allow-empty
          else
            python scripts/actions_state.py restore
          fi
      - name: Collect, expire, analyze, brief and build dashboard
        id: operate
        env:
          OPERATION_MODE: ${{ inputs.mode || 'scheduled' }}
        run: python -m carmgz.operations --mode "$OPERATION_MODE"
      - name: Validate snapshot before upload
        if: always() && steps.restore.outcome == 'success'
        id: validate
        run: python scripts/actions_state.py validate
      - name: Persist SQLite independently of deployment
        if: always() && steps.validate.outcome == 'success'
        id: persist
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STATE_PREFIX }}${{ github.run_id }}-${{ github.run_attempt }}
          path: data/news.sqlite3
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
      - name: Delete older state snapshots only after successful upload
        if: always() && steps.persist.outcome == 'success'
        run: python scripts/actions_state.py rotate
      - name: Upload dashboard for review
        if: steps.operate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-preview
          path: site
          retention-days: 1
      - name: Record failure summary (no article data or credentials)
        if: failure()
        run: echo 'Operation failed. Inspect the failed step; previous state is preserved unless a newer verified snapshot was uploaded.' >> "$GITHUB_STEP_SUMMARY"

  redeploy-runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.redeploy_run_id && !inputs.diagnose_auth
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    environment:
      name: cloudflare-pages
      url: https://carmgz-news-monitor.pages.dev/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify immutable dashboard source run
        env:
          SOURCE_RUN_ID: ${{ inputs.redeploy_run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/select_dashboard_artifact.py
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-preview
          path: site
          run-id: ${{ inputs.redeploy_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm run build:guard
      - run: python scripts/prepare_cloudflare.py
      - name: Preserve exact runtime deployment bundle for review
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-deployment-bundle
          path: cloudflare-dist
          if-no-files-found: error
          retention-days: 1
      - name: Verify Production bindings and deploy runtime repair
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python scripts/check_cloudflare.py
          pnpm exec wrangler pages deploy cloudflare-dist --project-name carmgz-news-monitor --branch main --commit-hash "$SOURCE_COMMIT" --commit-message "Runtime guard repair; existing dashboard preserved"
          python scripts/inspect_cloudflare_runtime.py
      - name: Delete Cloudflare deployments older than 24 hours (dashboard copies)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/prune_cloudflare.py

  deploy:
    needs: operate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    environment:
      name: cloudflare-pages
      url: https://carmgz-news-monitor.pages.dev/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-preview
          path: site
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build:guard
      - run: python scripts/prepare_cloudflare.py
      - name: Preserve exact Cloudflare deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-deployment-bundle
          path: cloudflare-dist
          if-no-files-found: error
          retention-days: 1
      - name: Check Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Set CLOUDFLARE_API_TOKEN in GitHub Secrets'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Set CLOUDFLARE_ACCOUNT_ID in GitHub Secrets'; exit 1; }
          python scripts/check_cloudflare.py
      - name: Deploy generated assets to existing private Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: pnpm exec wrangler pages deploy cloudflare-dist --project-name carmgz-news-monitor --branch main
      - name: Delete Cloudflare deployments older than 24 hours (dashboard copies)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/prune_cloudflare.py
